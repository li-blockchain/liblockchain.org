<!doctype html>
<!-- Source for public/og-card.jpg (1200x630 link preview). Regenerate from the repo root:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
    --window-size=1200,630 --virtual-time-budget=5000 --screenshot=og-card.png "file://$PWD/scripts/og-card.html"
  sips -s format jpeg -s formatOptions 85 og-card.png --out public/og-card.jpg && rm og-card.png
--><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{font-family:Inter,sans-serif;color:#fff;position:relative;
    background:
      radial-gradient(at 40% 20%, hsla(189,100%,41%,.22) 0px, transparent 55%),
      radial-gradient(at 85% 0%, hsla(271,76%,53%,.20) 0px, transparent 50%),
      radial-gradient(at 0% 60%, hsla(330,79%,56%,.10) 0px, transparent 50%),
      linear-gradient(135deg,#0f172a 0%,#1e293b 50%,#334155 100%);}
  .wrap{position:absolute;inset:0;padding:64px 80px;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;gap:32px}.logo{width:240px}.name{font-size:30px;font-weight:700;line-height:1.15;color:#e2e8f0;border-left:2px solid rgba(148,163,184,.35);padding-left:32px}
  h1{font-size:76px;font-weight:800;letter-spacing:-2px;line-height:1.02;margin:44px 0 0}
  h1 span{background:linear-gradient(135deg,#a855f7 0%,#ec4899 100%);-webkit-background-clip:text;color:transparent}
  .sub{font-size:30px;color:#cbd5e1;margin-top:20px;font-weight:500}
  .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center}
  .badge{font-size:22px;color:#22d3ee;border:1px solid rgba(0,153,204,.45);background:rgba(0,153,204,.12);
    padding:12px 22px;border-radius:999px;font-weight:500}
  .url{font-size:28px;font-weight:700;color:#e2e8f0}
</style></head><body><div class="wrap">
  <div class="top"><img class="logo" src="../public/libc-logo.png"><div class="name">Long Island<br>Blockchain</div></div>
  <h1>Ethereum validator<br><span>infrastructure</span></h1>
  <div class="sub">White-label validators, staking vaults and institutional staking.</div>
  <div class="foot"><div class="badge">$100M+ staked • Top 5% performance • SOC-2 datacenter</div><div class="url">libc.fi</div></div>
</div></body></html>
